# 登录接口测试数据
# expected_status: 期望 HTTP 状态码; expected_code: 期望业务码; expected_msg: 期望响应信息关键字
login_cases:
  - title: 正确账号密码登录成功
    username: "admin"
    password: "Admin@123"
    expected_status: 200
    expected_code: 0
    expected_msg: "success"

  - title: 密码错误登录失败
    username: "admin"
    password: "wrong_password"
    expected_status: 401
    expected_code: 401
    expected_msg: "用户名或密码错误"

  - title: 用户不存在登录失败
    username: "not_exist_user"
    password: "whatever123"
    expected_status: 401
    expected_code: 401
    expected_msg: "用户名或密码错误"

  - title: 用户名为空
    username: ""
    password: "Admin@123"
    expected_status: 400
    expected_code: 400
    expected_msg: "不能为空"

  - title: 密码为空
    username: "admin"
    password: ""
    expected_status: 400
    expected_code: 400
    expected_msg: "不能为空"

  - title: SQL注入尝试登录被拒绝
    username: "admin' OR '1'='1"
    password: "anything"
    expected_status: 401
    expected_code: 401
    expected_msg: "用户名或密码错误"
  - title: 用户名超长登录失败
    username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    password: "Admin@123"
    expected_status: 401
    expected_code: 401
    expected_msg: "用户名或密码错误"